apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# Swap the image owner/tag in one place (CI overrides this):
#   kustomize edit set image demo=ghcr.io/<you>/k8s-observability-platform-demo:<tag>
images:
  - name: ghcr.io/mjy-26/k8s-observability-platform-demo
    newName: ghcr.io/mjy-26/k8s-observability-platform-demo
    newTag: dev
