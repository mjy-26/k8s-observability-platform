# OPTIONAL: kube-prometheus-stack managed by Argo CD instead of Terraform.
# Reuses terraform/values/kube-prometheus-stack.yaml via multi-source $values
# (single source of truth for config). Not wired into the root app by default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.9.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/terraform/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/mjy-26/k8s-observability-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs in kube-prometheus-stack are large
